name: Deploy to Somee via FTP (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    env:
      DOTNET_VERSION: '9.0.x'
      PROJECT_PATH: 'Sistema de Gestion de RRHH\Api.Gateway.csproj'
      OUTPUT_DIR: './publish'
      RUNTIME_ID: 'win-x86'   # Somee suele correr 32-bit; si tu plan es 64-bit prueba 'win-x64'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" -c Release --no-restore

      # ❌ Quitar single-file | ✅ Self-contained tradicional
      - name: Publish (self-contained, NO single-file)
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c Release -r ${{ env.RUNTIME_ID }} --self-contained true -o "${{ env.OUTPUT_DIR }}"

      - name: List published files (tree)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "${{ env.OUTPUT_DIR }}" | Select-Object FullName

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: RHPlus.somee.com
          username: cidcid919310
          password: Cid919310$
          local-dir: ${{ env.OUTPUT_DIR }}/
          server-dir: /www.RHPlus.somee.com/
          protocol: ftp
          dangerous-clean-slate: true
