name: Deploy to Somee via FTP (develop)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    env:
      DOTNET_VERSION: '9.0.x'
      PROJECT_PATH: 'Sistema de Gestion de RRHH\Api.Gateway.csproj'
      OUTPUT_DIR: './publish'
      RUNTIME_ID: 'win-x86'   # Si tu plan es 64-bit, usa win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" -c Release --no-restore

      - name: Publish (self-contained, NO single-file)
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c Release -r ${{ env.RUNTIME_ID }} --self-contained true -o "${{ env.OUTPUT_DIR }}"

      - name: Ensure logs folder exists in publish
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ env.OUTPUT_DIR }}\logs" -Force | Out-Null

      # =======================
      # 1) Activar modo offline
      # =======================
      - name: Create maintenance file (app_offline.htm)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "_maintenance" -Force | Out-Null
          '@(Sitio en mantenimiento… vuelve en unos segundos)' | Out-File -FilePath "_maintenance/app_offline.htm" -Encoding utf8

      - name: Upload app_offline.htm (stop site)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: RHPlus.somee.com
          username: cidcid919310
          password: Cid919310$
          local-dir: _maintenance/
          server-dir: /www.RHPlus.somee.com/
          protocol: ftp
          dangerous-clean-slate: false  # No borres nada, solo sube el offline

      - name: Wait for IIS to stop app
        shell: pwsh
        run: Start-Sleep -Seconds 8

      # =======================
      # 2) Deploy normal
      # =======================
      - name: List published files (tree)
        shell: pwsh
        run: Get-ChildItem -Recurse "${{ env.OUTPUT_DIR }}" | Select-Object FullName

      - name: FTP Deploy (upload new build)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: RHPlus.somee.com
          username: cidcid919310
          password: Cid919310$
          local-dir: ${{ env.OUTPUT_DIR }}/
          server-dir: /www.RHPlus.somee.com/
          protocol: ftp
          dangerous-clean-slate: true    # Limpia sobrantes para un estado consistente

      # =======================
      # 3) Quitar modo offline
      # =======================
      - name: Remove app_offline.htm locally so server deletes it
        shell: pwsh
        run: Remove-Item -Path "${{ env.OUTPUT_DIR }}\app_offline.htm" -ErrorAction SilentlyContinue

      - name: Delete app_offline.htm from server (sync again)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: RHPlus.somee.com
          username: cidcid919310
          password: Cid919310$
          local-dir: ${{ env.OUTPUT_DIR }}/
          server-dir: /www.RHPlus.somee.com/
          protocol: ftp
          dangerous-clean-slate: true    # Al no existir localmente, se elimina del servidor

      # =======================
      # (Opcional) Smoke test
      # =======================
      - name: Smoke test /prueba
        shell: pwsh
        run: |
          $url = "https://rhplus.somee.com/prueba"
          $ok = $false
          for ($i=1; $i -le 10; $i++) {
            try {
              $res = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              if ($res.StatusCode -eq 200 -and $res.Content -match "Hola") { Write-Host "Smoke test OK"; $ok = $true; break }
            } catch { Start-Sleep -Seconds 6 }
          }
          if (-not $ok) { throw "Smoke test failed for $url" }
