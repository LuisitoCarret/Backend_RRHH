name: Deploy to Somee via FTP (develop)

on:
  push:
    branches:
      - develop
  # Puedes ejecutar manualmente si lo necesitas:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    env:
      DOTNET_VERSION: '9.0.x'
      PROJECT_PATH: 'Sistema de Gestion de RRHH\Api.Gateway.csproj'
      OUTPUT_DIR: './publish'
      RUNTIME_ID: 'win-x86'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" -c Release --no-restore

      - name: Publish (self-contained, single-file)
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c Release -r ${{ env.RUNTIME_ID }} --self-contained true -p:PublishSingleFile=true -o "${{ env.OUTPUT_DIR }}"

      - name: List published files
        run: dir ${{ env.OUTPUT_DIR }}
        shell: pwsh

      # 🔹 Despliegue directo a Somee (sin secrets)
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: RHPlus.somee.com          # 👈 Host directo sin ftp://
          username: cidcid919310            # 👈 Tu usuario
          password: Cid919310$              # 👈 Tu contraseña
          local-dir: ${{ env.OUTPUT_DIR }}/
          server-dir: /www.RHPlus.somee.com/  # 👈 Carpeta remota
          protocol: ftp                     # 👈 Usa ftp si FTPS da error
          dangerous-clean-slate: true
