name: Deploy to Somee (Gateway + Seguridad)

on:
  push:
    branches: [ sprint3_cristian ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: '9.0.x'
      # ⚙️ Rutas de tus proyectos
      GATEWAY_CSPROJ: 'Sistema de Gestion de RRHH/Api.Gateway.csproj'
      SEGURIDAD_CSPROJ: 'Modulo.Seguridad.API/Modulo.Seguridad.API.csproj'
      OUT_DIR: './publish'
      OUT_GATEWAY: './publish/gateway'
      OUT_SEGURIDAD: './publish/seguridad'
      # 🔐 Credenciales Somee (directas, como pediste)
      FTP_SERVER: rhplus.somee.com
      FTP_USER: cidcid919310
      FTP_PASS: Cid919310$

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ---------- Restore ----------
      - name: Restore Gateway
        run: dotnet restore "${{ env.GATEWAY_CSPROJ }}"

      - name: Restore Seguridad
        run: dotnet restore "${{ env.SEGURIDAD_CSPROJ }}"

      # ---------- Build ----------
      - name: Build Gateway
        run: dotnet build "${{ env.GATEWAY_CSPROJ }}" -c Release --no-restore

      - name: Build Seguridad
        run: dotnet build "${{ env.SEGURIDAD_CSPROJ }}" -c Release --no-restore

      # ---------- Publish (ligero y optimizado) ----------
      - name: Publish Gateway (framework-dependent)
        shell: pwsh
        run: >
          dotnet publish "${{ env.GATEWAY_CSPROJ }}"
          -c Release
          -o ${{ env.OUT_GATEWAY }}
          -p:SelfContained=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:GenerateDocumentationFile=false

      - name: Publish Seguridad (framework-dependent)
        shell: pwsh
        run: >
          dotnet publish "${{ env.SEGURIDAD_CSPROJ }}"
          -c Release
          -o ${{ env.OUT_SEGURIDAD }}
          -p:SelfContained=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:GenerateDocumentationFile=false

      # ---------- web.config (opcional, si lo tienes) ----------
      - name: Attach web.config to Gateway (if present)
        shell: pwsh
        run: |
          if (Test-Path "IIS/web.config") { Copy-Item "IIS/web.config" "${{ env.OUT_GATEWAY }}/web.config" -Force }

      - name: Attach web.config to Seguridad (if present)
        shell: pwsh
        run: |
          if (Test-Path "IIS/web.config") { Copy-Item "IIS/web.config" "${{ env.OUT_SEGURIDAD }}/web.config" -Force }

      # ---------- Verificar tamaño ----------
      - name: Check size Gateway
        shell: pwsh
        run: |
          $size = (Get-ChildItem "${{ env.OUT_GATEWAY }}" -Recurse | Measure-Object -Property Length -Sum).Sum/1MB
          "Gateway publish size: $([math]::Round($size,2)) MB"

      - name: Check size Seguridad
        shell: pwsh
        run: |
          $size = (Get-ChildItem "${{ env.OUT_SEGURIDAD }}" -Recurse | Measure-Object -Property Length -Sum).Sum/1MB
          "Seguridad publish size: $([math]::Round($size,2)) MB"

      # ---------- Deploy Gateway ----------
      - name: Deploy Gateway (FTPS, limpia raíz)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: ${{ env.OUT_GATEWAY }}/
          server-dir: /
          protocol: ftp
          dangerous-clean-slate: true

      # ---------- Deploy Seguridad ----------
      - name: Deploy Seguridad (FTPS, limpia /seguridad)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: ${{ env.OUT_SEGURIDAD }}/
          server-dir: /seguridad/
          protocol: ftp
          dangerous-clean-slate: true

      # ---------- Smoke test ----------
      - name: Smoke test /seguridad/auth/login
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "http://rhplus.somee.com/seguridad/auth/login"
          $body = '{"email":"admin@rhplus.com","password":"Admin123*"}'
          try {
            $resp = Invoke-WebRequest -Uri $url -Method POST -ContentType "application/json" -Body $body -TimeoutSec 30
            "Status: $($resp.StatusCode)"
            "Body: $($resp.Content)"
          } catch {
            "Smoke test failed: $($_.Exception.Message)"
            exit 1
          }
