name: Deploy to Somee (Gateway + Seguridad con app_offline)

on:
  push:
    branches: [ sprint3_cristian ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: '9.0.x'
      # Proyectos
      GATEWAY_CSPROJ: 'Sistema de Gestion de RRHH/Api.Gateway.csproj'
      SEGURIDAD_CSPROJ: 'Modulo.Seguridad.API/Modulo.Seguridad.API.csproj'
      # Carpetas locales
      OUT_ROOT: './publish/root'
      OUT_GATEWAY: './publish/root'
      OUT_SEGURIDAD: './publish/root/seguridad'
      # FTP
      FTP_SERVER: rhplus.somee.com
      FTP_USER: cidcid919310
      FTP_PASS: 'Cid919310$'
      # Rutas remotas (ajústalas si tu carpeta difiere)
      REMOTE_ROOT: '/www.RHPlus.somee.com/'
      REMOTE_SEG:  '/www.RHPlus.somee.com/seguridad/'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # ---------- Restore ----------
      - name: Restore Gateway
        run: dotnet restore "${{ env.GATEWAY_CSPROJ }}"

      - name: Restore Seguridad
        run: dotnet restore "${{ env.SEGURIDAD_CSPROJ }}"

      # ---------- Build ----------
      - name: Build Gateway (Release)
        run: dotnet build "${{ env.GATEWAY_CSPROJ }}" -c Release --no-restore

      - name: Build Seguridad (Release)
        run: dotnet build "${{ env.SEGURIDAD_CSPROJ }}" -c Release --no-restore

      # ---------- Publish (framework-dependent, multi-archivo) ----------
      - name: Publish Gateway → OUT_ROOT
        shell: pwsh
        run: >
          dotnet publish "${{ env.GATEWAY_CSPROJ }}"
          -c Release
          -o ${{ env.OUT_GATEWAY }}
          -p:SelfContained=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:GenerateDocumentationFile=false

      - name: Publish Seguridad → OUT_SEGURIDAD
        shell: pwsh
        run: >
          dotnet publish "${{ env.SEGURIDAD_CSPROJ }}"
          -c Release
          -o ${{ env.OUT_SEGURIDAD }}
          -p:SelfContained=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:GenerateDocumentationFile=false

      # ---------- Attach web.config ----------
      - name: Attach web.config to Gateway
        shell: pwsh
        run: |
          Copy-Item "Sistema de Gestion de RRHH/IIS/web.config" "${{ env.OUT_ROOT }}/web.config" -Force
      - name: Attach web.config to Seguridad
        shell: pwsh
        run: |
          Copy-Item "Modulo.Seguridad.API/IIS/web.config" "${{ env.OUT_SEGURIDAD }}/web.config" -Force

      # ---------- Debug tamaños ----------
      - name: Check publish sizes
        shell: pwsh
        run: |
          $sizeRoot = (Get-ChildItem "${{ env.OUT_ROOT }}" -Recurse | Measure-Object -Property Length -Sum).Sum/1MB
          "Root: $([math]::Round($sizeRoot,2)) MB"
          $sizeSeg = (Get-ChildItem "${{ env.OUT_SEGURIDAD }}" -Recurse | Measure-Object -Property Length -Sum).Sum/1MB
          "Seguridad: $([math]::Round($sizeSeg,2)) MB"

      # ===================== OFFLINE =====================
      - name: Create app_offline.htm (local)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path offline | Out-Null
          @"
          <!doctype html><html><head><meta charset="utf-8"/>
          <title>Maintenance</title>
          <meta name="viewport" content="width=device-width,initial-scale=1"/>
          <style>body{font-family:sans-serif;display:grid;place-items:center;height:100vh;margin:0} .card{max-width:520px;padding:24px;border:1px solid #ddd;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08)}</style>
          </head><body><div class="card"><h1>Estamos actualizando</h1><p>Vuelve en unos segundos…</p></div></body></html>
          "@ | Set-Content -Encoding UTF8 offline/app_offline.htm

      - name: Put site OFFLINE (root)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: offline/
          server-dir: ${{ env.REMOTE_ROOT }}
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          log-level: minimal

      - name: Put site OFFLINE (seguridad)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: offline/
          server-dir: ${{ env.REMOTE_SEG }}
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          log-level: minimal

      # ===================== DEPLOY =====================
      - name: Deploy Gateway to /www.RHPlus.somee.com/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: ${{ env.OUT_GATEWAY }}/
          server-dir: ${{ env.REMOTE_ROOT }}
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/node_modules/**
            **/IIS/**

      - name: Deploy Seguridad to /www.RHPlus.somee.com/seguridad/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: ${{ env.OUT_SEGURIDAD }}/
          server-dir: ${{ env.REMOTE_SEG }}
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/node_modules/**
            **/IIS/**

      # ===================== ONLINE =====================
      - name: Bring site ONLINE (remove app_offline.htm)
        shell: pwsh
        continue-on-error: true
        run: |
          $rootUri = "ftp://${{ env.FTP_USER }}:${{ env.FTP_PASS }}@${{ env.FTP_SERVER }}${{ env.REMOTE_ROOT }}app_offline.htm"
          $segUri  = "ftp://${{ env.FTP_USER }}:${{ env.FTP_PASS }}@${{ env.FTP_SERVER }}${{ env.REMOTE_SEG }}app_offline.htm"
          try { Invoke-WebRequest -Uri $rootUri -Method Delete -TimeoutSec 30 } catch { "Root delete: $($_.Exception.Message)" }
          try { Invoke-WebRequest -Uri $segUri  -Method Delete -TimeoutSec 30 } catch { "Seg delete: $($_.Exception.Message)" }
