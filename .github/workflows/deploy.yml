name: Deploy to Somee (Gateway + Seguridad) - Auto Detect Remote Dir

on:
  push:
    branches: [ sprint3_cristian ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: '9.0.x'
      # ⚙️ Ajusta si difieren en tu repo
      GATEWAY_CSPROJ: 'Sistema de Gestion de RRHH/Api.Gateway.csproj'
      SEGURIDAD_CSPROJ: 'Modulo.Seguridad.API/Modulo.Seguridad.API.csproj'
      OUT_GATEWAY: './publish/gateway'
      OUT_SEGURIDAD: './publish/seguridad'
      # 🔐 Credenciales directas (como pediste)
      FTP_SERVER: rhplus.somee.com
      FTP_USER: cidcid919310
      FTP_PASS: Cid919310$

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # ---------- Restore & Build ----------
      - name: Restore Gateway
        run: dotnet restore "${{ env.GATEWAY_CSPROJ }}"

      - name: Restore Seguridad
        run: dotnet restore "${{ env.SEGURIDAD_CSPROJ }}"

      - name: Build Gateway (Release)
        run: dotnet build "${{ env.GATEWAY_CSPROJ }}" -c Release --no-restore

      - name: Build Seguridad (Release)
        run: dotnet build "${{ env.SEGURIDAD_CSPROJ }}" -c Release --no-restore

      # ---------- Publish (ligero / framework-dependent) ----------
      - name: Publish Gateway
        shell: pwsh
        run: >
          dotnet publish "${{ env.GATEWAY_CSPROJ }}"
          -c Release
          -o ${{ env.OUT_GATEWAY }}
          -p:SelfContained=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:GenerateDocumentationFile=false

      - name: Publish Seguridad
        shell: pwsh
        run: >
          dotnet publish "${{ env.SEGURIDAD_CSPROJ }}"
          -c Release
          -o ${{ env.OUT_SEGURIDAD }}
          -p:SelfContained=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:GenerateDocumentationFile=false

      # ---------- Detectar base remota automáticamente ----------
      - name: Detect remote base dir
        id: detect_dir
        shell: pwsh
        env:
          CANDIDATES: "/,/wwwroot,/site/wwwroot,/public_html,/web,/inetpub/wwwroot"
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $server = "${{ env.FTP_SERVER }}"
          $user = "${{ env.FTP_USER }}"
          $pass = "${{ env.FTP_PASS }}"
          $candidates = "${{ env.CANDIDATES }}".Split(',')
          $found = $null

          foreach ($d in $candidates) {
            $url = "ftp://$server$d/"
            # list-only retorna 0 si el dir existe/accede
            curl.exe -u "$user`:$pass" --silent --list-only $url | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $found = $d
              break
            }
          }

          if (-not $found) {
            Write-Host "No se pudo detectar la base remota. Usando '/' por defecto."
            $found = "/"
          }

          Write-Host "REMOTE_BASE_DIR=$found" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Base detectada: $found"

      # ---------- Asegurar carpeta /seguridad en la base detectada ----------
      - name: Ensure remote /seguridad exists
        shell: pwsh
        run: |
          $server = "${{ env.FTP_SERVER }}"
          $user = "${{ env.FTP_USER }}"
          $pass = "${{ env.FTP_PASS }}"
          $base = "${{ env.REMOTE_BASE_DIR }}"
          $remoteSeg = "ftp://$server$base/seguridad/placeholder.txt"

          Set-Content -Path placeholder.txt -Value "init"
          curl.exe -u "$user`:$pass" --ftp-create-dirs -T placeholder.txt $remoteSeg
          if ($LASTEXITCODE -ne 0) {
            Write-Error "No se pudo crear la carpeta $($base)/seguridad. Revisa permisos y base dir."
            exit 1
          }
          Remove-Item placeholder.txt -Force
          Write-Host "Carpeta $($base)/seguridad verificada/creada correctamente."

      # ---------- Tamaño de artefactos ----------
      - name: Check size Gateway
        shell: pwsh
        run: |
          $size = (Get-ChildItem "${{ env.OUT_GATEWAY }}" -Recurse | Measure-Object -Property Length -Sum).Sum/1MB
          "Gateway publish size: $([math]::Round($size,2)) MB"

      - name: Check size Seguridad
        shell: pwsh
        run: |
          $size = (Get-ChildItem "${{ env.OUT_SEGURIDAD }}" -Recurse | Measure-Object -Property Length -Sum).Sum/1MB
          "Seguridad publish size: $([math]::Round($size,2)) MB"

      # ---------- Deploy Gateway ----------
      - name: Deploy Gateway (FTP, limpia base detectada)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: ${{ env.OUT_GATEWAY }}/
          server-dir: ${{ env.REMOTE_BASE_DIR }}
          protocol: ftp
          port: 21
          dangerous-clean-slate: true
          log-level: verbose

      # ---------- Deploy Seguridad ----------
      - name: Deploy Seguridad (FTP, limpia /seguridad)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: ${{ env.OUT_SEGURIDAD }}/
          server-dir: ${{ env.REMOTE_BASE_DIR }}/seguridad
          protocol: ftp
          port: 21
          dangerous-clean-slate: true
          log-level: verbose

      # ---------- Smoke test ----------
      - name: Smoke test /seguridad/auth/login
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "http://rhplus.somee.com/seguridad/auth/login"
          $body = '{"email":"admin@rhplus.com","password":"Admin123*"}'
          try {
            $resp = Invoke-WebRequest -Uri $url -Method POST -ContentType "application/json" -Body $body -TimeoutSec 30
            "Status: $($resp.StatusCode)"
            "Body: $($resp.Content)"
          } catch {
            "Smoke test failed: $($_.Exception.Message)"
            exit 1
          }
