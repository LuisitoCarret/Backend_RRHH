name: Deploy to Somee (Gateway + Seguridad - single-file)

on:
  push:
    branches: [ sprint3_cristian ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: '9.0.x'
      # Proyectos
      GATEWAY_CSPROJ: 'Sistema de Gestion de RRHH/Api.Gateway.csproj'
      SEGURIDAD_CSPROJ: 'Modulo.Seguridad.API/Modulo.Seguridad.API.csproj'
      # Carpetas de publicación locales
      OUT_ROOT: './publish/root'
      OUT_GATEWAY: './publish/root'
      OUT_SEGURIDAD: './publish/root/seguridad'
      # FTP
      FTP_SERVER: rhplus.somee.com
      FTP_USER: cidcid919310
      FTP_PASS: 'Cid919310$'
      # Quedarse en el directorio inicial (home del sitio)
      REMOTE_BASE_DIR: './'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ---------- Restore ----------
      - name: Restore Gateway
        run: dotnet restore "${{ env.GATEWAY_CSPROJ }}"

      - name: Restore Seguridad
        run: dotnet restore "${{ env.SEGURIDAD_CSPROJ }}"

      # ---------- Build ----------
      - name: Build Gateway (Release)
        run: dotnet build "${{ env.GATEWAY_CSPROJ }}" -c Release --no-restore

      - name: Build Seguridad (Release)
        run: dotnet build "${{ env.SEGURIDAD_CSPROJ }}" -c Release --no-restore

      # ---------- Publish (SINGLE-FILE framework-dependent, sin compresión) ----------
      - name: Publish Gateway → OUT_ROOT (single-file)
        shell: pwsh
        run: >
          dotnet publish "${{ env.GATEWAY_CSPROJ }}"
          -c Release
          -o ${{ env.OUT_GATEWAY }}
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesInSingleFile=true
          -p:UseAppHost=true
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:GenerateDocumentationFile=false

      - name: Publish Seguridad → OUT_ROOT/seguridad (single-file)
        shell: pwsh
        run: >
          dotnet publish "${{ env.SEGURIDAD_CSPROJ }}"
          -c Release
          -o ${{ env.OUT_SEGURIDAD }}
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesInSingleFile=true
          -p:UseAppHost=true
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:GenerateDocumentationFile=false

      # ---------- Copiar web.config (desde tu repo) ----------
      - name: Attach web.config to Gateway (if present)
        shell: pwsh
        run: |
          if (Test-Path "IIS/web.config") { Copy-Item "IIS/web.config" "${{ env.OUT_ROOT }}/web.config" -Force }

      - name: Attach web.config to Seguridad (if present)
        shell: pwsh
        run: |
          if (Test-Path "Modulo.Seguridad.API/IIS/web.config") {
            Copy-Item "Modulo.Seguridad.API/IIS/web.config" "${{ env.OUT_SEGURIDAD }}/web.config" -Force
          } elseif (Test-Path "IIS/web.config") {
            # fallback si usas un único web.config común
            Copy-Item "IIS/web.config" "${{ env.OUT_SEGURIDAD }}/web.config" -Force
          }

      # ---------- Limpieza: eliminar carpetas IIS de los artefactos ----------
      - name: Remove IIS folders from artifacts (avoid server 550)
        shell: pwsh
        run: |
          if (Test-Path "${{ env.OUT_ROOT }}/IIS") { Remove-Item -Recurse -Force "${{ env.OUT_ROOT }}/IIS" }
          if (Test-Path "${{ env.OUT_SEGURIDAD }}/IIS") { Remove-Item -Recurse -Force "${{ env.OUT_SEGURIDAD }}/IIS" }

      # ---------- Sanity: tamaños / estructura ----------
      - name: Check size OUT_ROOT
        shell: pwsh
        run: |
          $size = (Get-ChildItem "${{ env.OUT_ROOT }}" -Recurse | Measure-Object -Property Length -Sum).Sum/1MB
          "Total publish size (root package): $([math]::Round($size,2)) MB"
          "Estructura (top level):"
          Get-ChildItem "${{ env.OUT_ROOT }}" | Select-Object Name, Length
          "Estructura /seguridad (top level):"
          Get-ChildItem "${{ env.OUT_SEGURIDAD }}" | Select-Object Name, Length

      # ---------- Deploy en el directorio actual (home) ----------
      - name: Deploy Root Package (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: ${{ env.OUT_ROOT }}/
          server-dir: ${{ env.REMOTE_BASE_DIR }}   # "./" = quedarse en el home del sitio
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/node_modules/**
            IIS/**
            seguridad/IIS/**

      # ---------- Smoke test ----------
      - name: Smoke test /seguridad/auth/login
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "http://rhplus.somee.com/seguridad/auth/login"
          $body = '{"email":"admin@rhplus.com","password":"Admin123*"}'
          try {
            $resp = Invoke-WebRequest -Uri $url -Method POST -ContentType "application/json" -Body $body -TimeoutSec 30
            "Status: $($resp.StatusCode)"
            "Body: $($resp.Content)"
          } catch {
            "Smoke test failed: $($_.Exception.Message)"
            exit 1
          }
