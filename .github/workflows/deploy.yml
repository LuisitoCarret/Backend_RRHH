name: Deploy to Somee (Gateway + Seguridad)

on:
  push:
    branches: [ sprint3_cristian ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: '9.0.x'
      GATEWAY_CSPROJ: 'Sistema de Gestion de RRHH/Api.Gateway.csproj'
      SEGURIDAD_CSPROJ: 'Modulo.Seguridad.API/Modulo.Seguridad.API.csproj'
      OUT_ROOT: './publish/root'
      OUT_GATEWAY: './publish/root'
      OUT_SEGURIDAD: './publish/root/seguridad'
      FTP_SERVER: rhplus.somee.com
      FTP_USER: cidcid919310
      FTP_PASS: 'Cid919310$'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Restore/Build
      - name: Restore Gateway
        run: dotnet restore "${{ env.GATEWAY_CSPROJ }}"
      - name: Restore Seguridad
        run: dotnet restore "${{ env.SEGURIDAD_CSPROJ }}"
      - name: Build Gateway (Release)
        run: dotnet build "${{ env.GATEWAY_CSPROJ }}" -c Release --no-restore
      - name: Build Seguridad (Release)
        run: dotnet build "${{ env.SEGURIDAD_CSPROJ }}" -c Release --no-restore

      # Publish (framework-dependent multi-file)
      - name: Publish Gateway → OUT_ROOT
        shell: pwsh
        run: >
          dotnet publish "${{ env.GATEWAY_CSPROJ }}"
          -c Release
          -o ${{ env.OUT_GATEWAY }}
          -p:SelfContained=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:GenerateDocumentationFile=false

      - name: Publish Seguridad → OUT_SEGURIDAD
        shell: pwsh
        run: >
          dotnet publish "${{ env.SEGURIDAD_CSPROJ }}"
          -c Release
          -o ${{ env.OUT_SEGURIDAD }}
          -p:SelfContained=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:GenerateDocumentationFile=false

      # Attach web.config (usando los que te pasé arriba)
      - name: Attach web.config to Gateway
        shell: pwsh
        run: |
          Copy-Item "Sistema de Gestion de RRHH/IIS/web.config" "${{ env.OUT_ROOT }}/web.config" -Force

      - name: Attach web.config to Seguridad
        shell: pwsh
        run: |
          Copy-Item "Modulo.Seguridad.API/IIS/web.config" "${{ env.OUT_SEGURIDAD }}/web.config" -Force

      # Limpia carpetas IIS en artefactos si llegaran a colarse
      - name: Remove IIS folders from artifacts
        shell: pwsh
        run: |
          if (Test-Path "${{ env.OUT_ROOT }}/IIS") { Remove-Item -Recurse -Force "${{ env.OUT_ROOT }}/IIS" }
          if (Test-Path "${{ env.OUT_SEGURIDAD }}/IIS") { Remove-Item -Recurse -Force "${{ env.OUT_SEGURIDAD }}/IIS" }

      # Debug sizes
      - name: Check publish sizes
        shell: pwsh
        run: |
          $sizeRoot = (Get-ChildItem "${{ env.OUT_ROOT }}" -Recurse | Measure-Object -Property Length -Sum).Sum/1MB
          "Root: $([math]::Round($sizeRoot,2)) MB"
          $sizeSeg = (Get-ChildItem "${{ env.OUT_SEGURIDAD }}" -Recurse | Measure-Object -Property Length -Sum).Sum/1MB
          "Seguridad: $([math]::Round($sizeSeg,2)) MB"

      # Deploy Gateway a carpeta del sitio (ajusta a tu nombre exacto)
      - name: Deploy Gateway to /www.RHPlus.somee.com/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: ${{ env.OUT_GATEWAY }}/
          server-dir: /www.RHPlus.somee.com/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/node_modules/**
            **/IIS/**

      # Deploy Seguridad (requiere que YA exista /seguridad/ en el FTP — como ya la creaste)
      - name: Deploy Seguridad to /www.RHPlus.somee.com/seguridad/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          local-dir: ${{ env.OUT_SEGURIDAD }}/
          server-dir: /www.RHPlus.somee.com/seguridad/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/node_modules/**
            **/IIS/**
